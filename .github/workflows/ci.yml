name: English Reconstruction V2 CI

# Phase 5.0（infra_github_actions_ci_002）：远程质量门禁。
# 只做验证：不部署、不发布、不写入仓库、不接触任何真实学习数据或 AI 密钥。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Run all tests
        run: npm test

      - name: Production build
        run: npm run build

      # Phase 14：缓存名必须由构建产物指纹生成；预缓存或资产变化时不允许沿用旧缓存名。
      - name: Verify PWA cache is build-stamped
        run: |
          if ! grep -Eq "const CACHE = 'erv2-shell-v2-[a-f0-9]{10}';" dist/sw.js; then
            echo "::error::dist/sw.js 缺少构建指纹缓存名 — 运行 npm run build"
            exit 1
          fi
          echo "ok: PWA cache is build-stamped"

      # dist 纳入 Git，但只在 Node 22 上核对一次，避免矩阵重复报同一个差异。
      # 若 Linux 与 Windows 出现合法差异，必须先在本地定位原因，不允许直接删掉这一步。
      - name: Verify committed build artifacts
        if: matrix.node == 22
        run: git diff --exit-code -- dist

      # 测试钩子隔离的硬证据：生产产物中不得出现 __labTest（构建期开关关闭 → 摇树移除）。
      - name: Verify production bundle has no test hooks
        run: |
          if grep -rq "__labTest" dist/assets/*.js; then
            echo "::error::production bundle contains __labTest — test hook leaked into production build"
            exit 1
          fi
          echo "ok: production bundle has no test hook"
